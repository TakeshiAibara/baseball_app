<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚾ 野球観戦記録アプリ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1a2a4a;
      --navy-light: #243558;
      --navy-dark: #0f172a;
      --accent: #38bdf8;
      --win: #10b981;
      --lose: #f43f5e;
      --draw: #64748b;
      --cancel: #94a3b8;
      --gold: #f59e0b;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --white: #ffffff;
      --radius: 16px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--navy-dark);
      color: var(--white);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
    header h1 span { color: var(--accent); }

    /* ===== TAB NAV ===== */
    .tab-nav {
      background: var(--navy);
      display: flex;
      padding: 0 1rem;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 1rem 1.5rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--white); }
    .tab-btn.active {
      color: var(--white);
      border-bottom-color: var(--accent);
    }

    /* ===== MAIN CONTENT ===== */
    main { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
    .tab-content { display: none; animation: fadeIn 0.4s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== CARDS ===== */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--navy-dark);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .card-title::before {
      content: '';
      width: 4px;
      height: 1.2rem;
      background: var(--accent);
      border-radius: 2px;
    }

    /* ===== STATS GRID ===== */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-box {
      background: var(--navy);
      color: var(--white);
      padding: 1.5rem;
      border-radius: var(--radius);
      text-align: center;
      transition: transform 0.3s;
    }
    .stat-box:hover { transform: translateY(-5px); }
    .stat-box .label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .stat-box .value { font-size: 2rem; font-weight: 800; color: var(--accent); }

    /* ===== CHART ROW ===== */
    .chart-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .chart-container { position: relative; height: 300px; width: 100%; }

    /* ===== FORM STYLES ===== */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: var(--navy-dark); }
    .form-group input, .form-group select, .form-group textarea {
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1); }
    
    /* ===== BUTTONS ===== */
    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary { background: var(--navy); color: var(--white); }
    .btn-primary:hover { background: var(--navy-light); }
    .btn-accent { background: var(--accent); color: var(--navy-dark); }
    .btn-accent:hover { opacity: 0.9; }
    .btn-danger { background: var(--lose); color: var(--white); }

    /* ===== TABLE ===== */
    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; background: var(--white); }
    th { background: var(--navy); color: var(--white); padding: 1rem; text-align: left; font-size: 0.85rem; }
    td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f1f5f9; }

    /* ===== STREAK BOX ===== */
    .streak-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .streak-card { padding: 1.5rem; border-radius: var(--radius); text-align: center; color: var(--white); }
    .streak-card.win { background: linear-gradient(135deg, #059669, #10b981); }
    .streak-card.lose { background: linear-gradient(135deg, #e11d48, #f43f5e); }
    .streak-card .s-label { font-size: 0.9rem; opacity: 0.9; margin-bottom: 0.5rem; }
    .streak-card .s-value { font-size: 2.5rem; font-weight: 900; }
    .streak-card .s-period { font-size: 0.75rem; opacity: 0.8; margin-top: 0.5rem; }

    /* ===== TOAST ===== */
    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 1rem 2rem;
      border-radius: 12px;
      background: var(--navy-dark);
      color: var(--white);
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      transform: translateY(100px);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
    }
    #toast.show { transform: translateY(0); }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--white);
      width: 90%;
      max-width: 600px;
      border-radius: var(--radius);
      padding: 2rem;
      max-height: 90vh;
      overflow-y: auto;
    }

    /* ===== STAR RATING ===== */
    .stars { display: flex; gap: 0.25rem; color: var(--gold); font-size: 1.2rem; }
    .star-input { display: flex; flex-direction: row-reverse; gap: 0.5rem; }
    .star-input input { display: none; }
    .star-input label { font-size: 2rem; color: #cbd5e1; cursor: pointer; transition: color 0.2s; }
    .star-input label:hover, .star-input label:hover ~ label,
    .star-input input:checked ~ label { color: var(--gold); }

    /* ===== STADIUM TABLES ===== */
    .stadium-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    .stadium-table-card h4 { margin-bottom: 1rem; color: var(--navy); border-left: 4px solid var(--accent); padding-left: 0.5rem; }

    @media (max-width: 768px) {
      .streak-container { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>⚾ <span>BASEBALL</span> LOG</h1>
  <div id="sync-status" style="font-size: 0.75rem; opacity: 0.8;"></div>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('top')">🏠 TOP</button>
  <button class="tab-btn" onclick="switchTab('record')">📝 試合記録</button>
  <button class="tab-btn" onclick="switchTab('stats')">📊 通算成績</button>
  <button class="tab-btn" onclick="switchTab('detail')">📋 試合詳細</button>
</nav>

<main>
  <!-- TOP TAB -->
  <div id="tab-top" class="tab-content active">
    <div class="stat-grid">
      <div class="stat-box">
        <div class="label">通算試合数</div>
        <div class="value" id="top-total">0</div>
      </div>
      <div class="stat-box">
        <div class="label">通算勝率</div>
        <div class="value" id="top-winrate">.000</div>
      </div>
      <div class="stat-box">
        <div class="label">勝利数</div>
        <div class="value" id="top-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="label">敗戦数</div>
        <div class="value" id="top-loses">0</div>
      </div>
    </div>

    <div class="chart-row">
      <div class="card">
        <div class="card-title">通算成績</div>
        <div class="chart-container"><canvas id="chart-top-overall"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">ホーム成績</div>
        <div class="chart-container"><canvas id="chart-top-home"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">ビジター成績</div>
        <div class="chart-container"><canvas id="chart-top-visitor"></canvas></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">直近5試合の結果</div>
      <div id="top-recent-list"></div>
    </div>
  </div>

  <!-- RECORD TAB -->
  <div id="tab-record" class="tab-content">
    <div class="card">
      <div class="card-title">試合記録を入力</div>
      <form id="record-form" onsubmit="saveRecord(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>📅 日付</label>
            <input type="date" id="f-date" required onchange="updateDayOfWeek()">
          </div>
          <div class="form-group">
            <label>曜日</label>
            <input type="text" id="f-dow" readonly style="background:#f1f5f9">
          </div>
          <div class="form-group">
            <label>🆚 相手チーム</label>
            <select id="f-opponent" onchange="toggleOpponentInput()" required>
              <option value="">選択してください</option>
              <optgroup label="セ・リーグ">
                <option value="読売ジャイアンツ">読売ジャイアンツ</option>
                <option value="阪神タイガース">阪神タイガース</option>
                <option value="横浜DeNAベイスターズ">横浜DeNAベイスターズ</option>
                <option value="広島東洋カープ">広島東洋カープ</option>
                <option value="中日ドラゴンズ">中日ドラゴンズ</option>
                <option value="東京ヤクルトスワローズ">東京ヤクルトスワローズ</option>
              </optgroup>
              <optgroup label="パ・リーグ">
                <option value="福岡ソフトバンクホークス">福岡ソフトバンクホークス</option>
                <option value="オリックス・バファローズ">オリックス・バファローズ</option>
                <option value="千葉ロッテマリーンズ">千葉ロッテマリーンズ</option>
                <option value="東北楽天ゴールデンイーグルス">東北楽天ゴールデンイーグルス</option>
                <option value="埼玉西武ライオンズ">埼玉西武ライオンズ</option>
                <option value="北海道日本ハムファイターズ">北海道日本ハムファイターズ</option>
              </optgroup>
              <optgroup label="その他">
                <option value="__intl__">国際試合</option>
                <option value="__other__">その他</option>
              </optgroup>
            </select>
          </div>
          <div class="form-group" id="f-opponent-custom-wrap" style="display:none">
            <label id="f-opponent-custom-label">チーム名 / 国名</label>
            <input type="text" id="f-opponent-custom">
          </div>
          <div class="form-group">
            <label>🏟️ 立場</label>
            <select id="f-stance">
              <option value="ホーム">ホーム</option>
              <option value="ビジター">ビジター</option>
            </select>
          </div>
          <div class="form-group">
            <label>📍 球場</label>
            <select id="f-stadium" onchange="toggleStadiumInput()">
              <option value="">選択してください</option>
              <optgroup label="セ・リーグ本拠地">
                <option value="東京ドーム">東京ドーム</option>
                <option value="甲子園球場">甲子園球場</option>
                <option value="横浜スタジアム">横浜スタジアム</option>
                <option value="MAZDA Zoom-Zoom スタジアム広島">MAZDA広島</option>
                <option value="バンテリンドームナゴヤ">バンテリンドーム</option>
                <option value="明治神宮野球場">神宮球場</option>
              </optgroup>
              <optgroup label="パ・リーグ本拠地">
                <option value="みずほPayPayドーム福岡">PayPayドーム</option>
                <option value="京セラドーム大阪">京セラドーム</option>
                <option value="ZOZOマリンスタジアム">ZOZOマリン</option>
                <option value="楽天モバイルパーク宮城">楽天モバイル</option>
                <option value="ベルーナドーム">ベルーナドーム</option>
                <option value="エスコンフィールドHOKKAIDO">エスコン</option>
              </optgroup>
              <option value="__other__">その他</option>
            </select>
          </div>
          <div class="form-group" id="f-stadium-custom-wrap" style="display:none">
            <label>球場名</label>
            <input type="text" id="f-stadium-custom">
          </div>
        </div>

        <div style="margin-top:1.5rem; display:flex; align-items:center; gap:1rem;">
          <input type="checkbox" id="f-cancel" onchange="toggleCancelMode()" style="width:20px; height:20px">
          <label for="f-cancel" style="font-weight:700; color:var(--lose)">⚠️ 試合中止</label>
        </div>

        <div id="score-section" class="form-grid" style="margin-top:1.5rem">
          <div class="form-group">
            <label>🔢 自チームの得点</label>
            <select id="f-score-my">
              <script>for(let i=0;i<=30;i++) document.write(`<option value="${i}">${i}</option>`);</script>
            </select>
          </div>
          <div class="form-group">
            <label>🔢 相手チームの得点</label>
            <select id="f-score-opp">
              <script>for(let i=0;i<=30;i++) document.write(`<option value="${i}">${i}</option>`);</script>
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-top:1.5rem">
          <label>💬 コメント</label>
          <textarea id="f-comment" placeholder="試合の感想を入力..."></textarea>
        </div>

        <div class="form-group" style="margin-top:1.5rem">
          <label>⭐ 満足度</label>
          <div class="star-input">
            <input type="radio" name="satisfaction" id="s5" value="5"><label for="s5">★</label>
            <input type="radio" name="satisfaction" id="s4" value="4"><label for="s4">★</label>
            <input type="radio" name="satisfaction" id="s3" value="3"><label for="s3">★</label>
            <input type="radio" name="satisfaction" id="s2" value="2"><label for="s2">★</label>
            <input type="radio" name="satisfaction" id="s1" value="1"><label for="s1">★</label>
          </div>
        </div>

        <div style="margin-top:2rem">
          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center">試合記録を保存</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="card-title">GitHub API連携設定</div>
      <div class="form-grid">
        <div class="form-group"><label>ユーザー名</label><input type="text" id="gh-user" placeholder="GitHub Username"></div>
        <div class="form-group"><label>リポジトリ名</label><input type="text" id="gh-repo" placeholder="Repository Name"></div>
        <div class="form-group"><label>ファイルパス</label><input type="text" id="gh-path" placeholder="data/records.csv"></div>
        <div class="form-group"><label>アクセストークン</label><input type="password" id="gh-token" placeholder="github_pat_..."></div>
      </div>
      <div style="margin-top:1rem; display:flex; gap:1rem; align-items:center">
        <button class="btn btn-accent" onclick="saveGithubConfig()">設定を保存</button>
        <button class="btn btn-outline" onclick="fetchGithubCSV()">最新データを取得</button>
        <label style="font-size:0.85rem; display:flex; align-items:center; gap:0.5rem">
          <input type="checkbox" id="gh-auto-sync" checked> 自動同期
        </label>
      </div>
    </div>
  </div>

  <!-- STATS TAB -->
  <div id="tab-stats" class="tab-content">
    <div class="streak-container" style="margin-bottom:1.5rem">
      <div class="streak-card win">
        <div class="s-label">最多連勝</div>
        <div class="s-value" id="max-win-streak">0連勝</div>
        <div class="s-period" id="max-win-period">—</div>
      </div>
      <div class="streak-card lose">
        <div class="s-label">最多連敗</div>
        <div class="s-value" id="max-lose-streak">0連敗</div>
        <div class="s-period" id="max-lose-period">—</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">戦績推移</div>
      <div class="chart-container" style="height:350px"><canvas id="chart-stats-trend"></canvas></div>
    </div>

    <div class="card">
      <div class="card-title">年度別成績</div>
      <div id="year-tabs" style="display:flex; gap:0.5rem; margin-bottom:1rem; overflow-x:auto"></div>
      <div class="chart-row">
        <div class="chart-container"><canvas id="chart-year-pie"></canvas></div>
        <div id="year-summary" style="display:flex; flex-direction:column; justify-content:center; gap:0.5rem"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">曜日別成績</div>
      <div class="chart-container"><canvas id="chart-dow"></canvas></div>
    </div>

    <div class="card">
      <div class="card-title">球場別成績</div>
      <div class="stadium-grid">
        <div class="stadium-table-card">
          <h4>セ・リーグ球場</h4>
          <div class="table-wrap"><table class="stadium-table"><thead><tr><th>球場</th><th>試合</th><th>勝</th><th>負</th><th>分</th><th>勝率</th></tr></thead><tbody id="stadium-tbody-central"></tbody></table></div>
        </div>
        <div class="stadium-table-card">
          <h4>パ・リーグ球場</h4>
          <div class="table-wrap"><table class="stadium-table"><thead><tr><th>球場</th><th>試合</th><th>勝</th><th>負</th><th>分</th><th>勝率</th></tr></thead><tbody id="stadium-tbody-pacific"></tbody></table></div>
        </div>
        <div class="stadium-table-card">
          <h4>その他</h4>
          <div class="table-wrap"><table class="stadium-table"><thead><tr><th>球場</th><th>試合</th><th>勝</th><th>負</th><th>分</th><th>勝率</th></tr></thead><tbody id="stadium-tbody-other"></tbody></table></div>
        </div>
      </div>
    </div>

    <div class="chart-row">
      <div class="card">
        <div class="card-title">ベスト試合 TOP5</div>
        <div id="best-games-list"></div>
      </div>
      <div class="card">
        <div class="card-title">ワースト試合 TOP5</div>
        <div id="worst-games-list"></div>
      </div>
    </div>
  </div>

  <!-- DETAIL TAB -->
  <div id="tab-detail" class="tab-content">
    <div class="card">
      <div class="card-title">試合一覧</div>
      <div class="form-grid" style="margin-bottom:1.5rem">
        <div class="form-group"><input type="text" id="detail-search" placeholder="チーム名、球場、コメントで検索..." oninput="renderDetailTable()"></div>
        <div class="form-group"><select id="detail-year-filter" onchange="renderDetailTable()"><option value="">全年度</option></select></div>
        <div class="form-group"><select id="detail-result-filter" onchange="renderDetailTable()"><option value="">全結果</option><option value="勝">勝</option><option value="負">負</option><option value="引き分け">引き分け</option><option value="中止">中止</option></select></div>
        <div class="form-group"><select id="detail-sort" onchange="renderDetailTable()"><option value="desc">日付の新しい順</option><option value="asc">日付の古い順</option></select></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>日付</th><th>相手</th><th>立場</th><th>球場</th><th>スコア</th><th>結果</th><th>満足度</th><th>操作</th></tr></thead>
          <tbody id="detail-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

        <input type="radio" name="e-satisfaction" id="es2" value="2"><label for="es2">★</label>
        <input type="radio" name="e-satisfaction" id="es1" value="1"><label for="es1">★</label>

<div id="toast"></div>

<script>
  const STORAGE_KEY = 'baseball_records_v2';
  const GH_CONFIG_KEY = 'baseball_github_config_v2';
  const DAYS = ['日','月','火','水','木','金','土'];

  // --- DATA HELPERS ---
  function loadRecords() {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }
  function saveRecords(records) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }
  function getResult(rec) {
    if (rec.cancel) return '中止';
    const my = parseInt(rec.scoreMyTeam);
    const opp = parseInt(rec.scoreOpponent);
    if (isNaN(my) || isNaN(opp)) return '—';
    if (my > opp) return '勝';
    if (my < opp) return '負';
    return '引き分け';
  }
  function getOpponentDisplay(rec) {
    if (rec.opponentType === '__intl__') return `🌐 ${rec.opponentCustom}`;
    if (rec.opponentType === '__other__') return rec.opponentCustom;
    return rec.opponent;
  }
  function getStadiumDisplay(rec) {
    if (rec.stadiumType === '__other__') return rec.stadiumCustom;
    return rec.stadium;
  }
  function starsHTML(n) {
    return '<div class="stars">' + '★'.repeat(n) + '<span style="color:#e2e8f0">' + '★'.repeat(5-n) + '</span></div>';
  }

  // --- UI HELPERS ---
  function showToast(msg, type='info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = type === 'error' ? 'var(--lose)' : type === 'success' ? 'var(--win)' : 'var(--navy-dark)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.querySelector(`button[onclick="switchTab('${tab}')"]`).classList.add('active');
    if (tab === 'top') renderTop();
    if (tab === 'stats') renderStats();
    if (tab === 'detail') renderDetailTable();
  }

  function updateDayOfWeek() {
    const d = document.getElementById('f-date').value;
    if (!d) return;
    document.getElementById('f-dow').value = DAYS[new Date(d + 'T00:00:00').getDay()] + '曜日';
  }
  function updateEditDayOfWeek() {
    const d = document.getElementById('e-date').value;
    if (!d) return;
    document.getElementById('e-dow').value = DAYS[new Date(d + 'T00:00:00').getDay()] + '曜日';
  }
  function toggleOpponentInput() {
    const v = document.getElementById('f-opponent').value;
    const wrap = document.getElementById('f-opponent-custom-wrap');
    wrap.style.display = (v === '__intl__' || v === '__other__') ? '' : 'none';
    document.getElementById('f-opponent-custom-label').textContent = v === '__intl__' ? '国名' : 'チーム名';
  }
  function toggleStadiumInput() {
    const v = document.getElementById('f-stadium').value;
    document.getElementById('f-stadium-custom-wrap').style.display = v === '__other__' ? '' : 'none';
  }
  function toggleCancelMode() {
    const c = document.getElementById('f-cancel').checked;
    document.getElementById('score-section').style.opacity = c ? '0.3' : '1';
    document.getElementById('score-section').style.pointerEvents = c ? 'none' : '';
  }

  // --- CORE FUNCTIONS ---
  async function saveRecord(e) {
    e.preventDefault();
    const records = loadRecords();
    const date = document.getElementById('f-date').value;
    const oppType = document.getElementById('f-opponent').value;
    const cancel = document.getElementById('f-cancel').checked;
    const sat = document.querySelector('input[name="satisfaction"]:checked');

    const newRec = {
      id: Date.now(),
      date,
      dow: DAYS[new Date(date + 'T00:00:00').getDay()],
      opponent: (oppType === '__intl__' || oppType === '__other__') ? document.getElementById('f-opponent-custom').value : oppType,
      opponentType: oppType,
      opponentCustom: document.getElementById('f-opponent-custom').value,
      stance: document.getElementById('f-stance').value,
      stadium: document.getElementById('f-stadium').value === '__other__' ? document.getElementById('f-stadium-custom').value : document.getElementById('f-stadium').value,
      stadiumType: document.getElementById('f-stadium').value,
      stadiumCustom: document.getElementById('f-stadium-custom').value,
      cancel,
      scoreMyTeam: cancel ? '-' : document.getElementById('f-score-my').value,
      scoreOpponent: cancel ? '-' : document.getElementById('f-score-opp').value,
      comment: document.getElementById('f-comment').value,
      satisfaction: sat ? parseInt(sat.value) : 0
    };

    records.push(newRec);
    saveRecords(records);
    showToast('記録を保存しました', 'success');
    e.target.reset();
    updateDayOfWeek();
    if (document.getElementById('gh-auto-sync').checked) await pushToGithub('試合記録の追加');
  }

  function renderTop() {
    const records = loadRecords();
    const wins = records.filter(r => getResult(r) === '勝').length;
    const loses = records.filter(r => getResult(r) === '負').length;
    const draws = records.filter(r => getResult(r) === '引き分け').length;
    const cancels = records.filter(r => getResult(r) === '中止').length;
    const winrate = (wins + loses > 0) ? (wins / (wins + loses)).toFixed(3) : '.000';

    document.getElementById('top-total').textContent = records.length;
    document.getElementById('top-winrate').textContent = winrate;
    document.getElementById('top-wins').textContent = wins;
    document.getElementById('top-loses').textContent = loses;

    renderPie('chart-top-overall', [wins, loses, draws, cancels]);
    renderPie('chart-top-home', getWLDC(records.filter(r => r.stance === 'ホーム')));
    renderPie('chart-top-visitor', getWLDC(records.filter(r => r.stance === 'ビジター')));

    const recent = [...records].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 5);
    document.getElementById('top-recent-list').innerHTML = recent.map(r => {
      const res = getResult(r);
      const color = res === '勝' ? 'var(--win)' : res === '負' ? 'var(--lose)' : 'var(--draw)';
      return `<div style="display:flex; align-items:center; padding:1rem; border-bottom:1px solid var(--border); gap:1rem">
        <div style="font-size:0.8rem; color:var(--text-muted); width:80px">${r.date}</div>
        <div style="font-weight:700; flex:1">${getOpponentDisplay(r)}</div>
        <div style="font-weight:800; width:60px; text-align:center">${r.cancel ? '中止' : r.scoreMyTeam + '-' + r.scoreOpponent}</div>
        <div style="color:${color}; font-weight:900; width:30px">${res[0]}</div>
        <div>${starsHTML(r.satisfaction)}</div>
      </div>`;
    }).join('') || '<p style="text-align:center; padding:2rem; color:var(--text-muted)">記録がありません</p>';
  }

  function getWLDC(recs) {
    return [
      recs.filter(r => getResult(r) === '勝').length,
      recs.filter(r => getResult(r) === '負').length,
      recs.filter(r => getResult(r) === '引き分け').length,
      recs.filter(r => getResult(r) === '中止').length
    ];
  }

  let charts = {};
  function renderPie(id, data) {
    if (charts[id]) charts[id].destroy();
    const ctx = document.getElementById(id).getContext('2d');
    charts[id] = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['勝', '負', '分', '中止'],
        datasets: [{ data, backgroundColor: ['#10b981', '#f43f5e', '#64748b', '#94a3b8'], borderWeight: 0 }]
      },
      options: { cutout: '70%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
    });
  }

  function renderStats() {
    const records = loadRecords();
    renderStreaks(records);
    renderTrend(records);
    renderYearly(records);
    renderDow(records);
    renderStadiums(records);
    renderBestWorst(records);
  }

  function renderStreaks(records) {
    const sorted = [...records].sort((a,b) => a.date.localeCompare(b.date) || (a.id - b.id));
    let maxW = 0, maxL = 0, curW = 0, curL = 0;
    let maxWStart = '', maxWEnd = '', maxLStart = '', maxLEnd = '';
    let curWStart = '', curLStart = '';

    sorted.forEach(r => {
      const res = getResult(r);
      if (res === '勝') {
        if (curW === 0) curWStart = r.date;
        curW++; curL = 0;
        if (curW >= maxW) { maxW = curW; maxWStart = curWStart; maxWEnd = r.date; }
      } else if (res === '負') {
        if (curL === 0) curLStart = r.date;
        curL++; curW = 0;
        if (curL >= maxL) { maxL = curL; maxLStart = curLStart; maxLEnd = r.date; }
      }
      // 引き分け・中止はカウントを増やさず、リセットもしない（継続）
    });

    document.getElementById('max-win-streak').textContent = maxW + '連勝';
    document.getElementById('max-win-period').textContent = maxW > 0 ? `${maxWStart} 〜 ${maxWEnd}` : '—';
    document.getElementById('max-lose-streak').textContent = maxL + '連敗';
    document.getElementById('max-lose-period').textContent = maxL > 0 ? `${maxLStart} 〜 ${maxLEnd}` : '—';
  }

  function renderTrend(records) {
    if (charts['trend']) charts['trend'].destroy();
    const sorted = [...records].sort((a,b) => a.date.localeCompare(b.date) || (a.id - b.id));
    let val = 0;
    const data = sorted.map(r => {
      const res = getResult(r);
      if (res === '勝') val++; else if (res === '負') val--;
      return val;
    });
    const ctx = document.getElementById('chart-stats-trend').getContext('2d');
    charts['trend'] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: sorted.map((_,i) => i+1),
        datasets: [{ label: '戦績推移', data, borderColor: 'var(--accent)', tension: 0.3, fill: true, backgroundColor: 'rgba(56, 189, 248, 0.1)' }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  function renderYearly(records) {
    const years = [...new Set(records.map(r => r.date.slice(0,4)))].sort().reverse();
    const container = document.getElementById('year-tabs');
    container.innerHTML = years.map(y => `<button class="btn btn-sm btn-outline" onclick="updateYearly('${y}')">${y}年</button>`).join('');
    if (years.length) updateYearly(years[0]);
  }

  function updateYearly(year) {
    const records = loadRecords().filter(r => r.date.startsWith(year));
    const wldc = getWLDC(records);
    renderPie('chart-year-pie', wldc);
    const avgSat = records.length ? (records.reduce((a,b) => a + b.satisfaction, 0) / records.length).toFixed(2) : '0.00';
    document.getElementById('year-summary').innerHTML = `
      <div style="font-weight:800; font-size:1.2rem; color:var(--navy)">${year}年度成績</div>
      <div>試合数: ${records.length}</div>
      <div style="color:var(--win)">勝利: ${wldc[0]}</div>
      <div style="color:var(--lose)">敗戦: ${wldc[1]}</div>
      <div>平均満足度: ⭐ ${avgSat}</div>
    `;
  }

  function renderDow(records) {
    if (charts['dow']) charts['dow'].destroy();
    const data = DAYS.map(d => {
      const recs = records.filter(r => r.dow === d + '曜日');
      return getWLDC(recs);
    });
    const ctx = document.getElementById('chart-dow').getContext('2d');
    charts['dow'] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: DAYS,
        datasets: [
          { label: '勝', data: data.map(d => d[0]), backgroundColor: '#10b981' },
          { label: '負', data: data.map(d => d[1]), backgroundColor: '#f43f5e' },
          { label: '分', data: data.map(d => d[2]), backgroundColor: '#64748b' }
        ]
      },
      options: { scales: { x: { stacked: true }, y: { stacked: true } } }
    });
  }

  function renderStadiums(records) {
    const central = ['東京ドーム','甲子園球場','横浜スタジアム','MAZDA Zoom-Zoom スタジアム広島','バンテリンドームナゴヤ','明治神宮野球場'];
    const pacific = ['みずほPayPayドーム福岡','京セラドーム大阪','ZOZOマリンスタジアム','楽天モバイルパーク宮城','ベルーナドーム','エスコンフィールドHOKKAIDO'];
    
    const stats = {};
    records.forEach(r => {
      const s = getStadiumDisplay(r);
      if (!stats[s]) stats[s] = {t:0,w:0,l:0,d:0};
      stats[s].t++;
      const res = getResult(r);
      if (res==='勝') stats[s].w++; else if (res==='負') stats[s].l++; else if (res==='引き分け') stats[s].d++;
    });

    const fill = (id, list, other=false) => {
      const tbody = document.getElementById(id);
      const items = Object.entries(stats).filter(([name]) => other ? (!central.includes(name) && !pacific.includes(name)) : list.includes(name));
      tbody.innerHTML = items.sort((a,b) => b[1].t - a[1].t).map(([name, d]) => {
        const wr = (d.w + d.l > 0) ? (d.w / (d.w + d.l)).toFixed(3) : '.000';
        return `<tr><td>${name}</td><td>${d.t}</td><td style="color:var(--win)">${d.w}</td><td style="color:var(--lose)">${d.l}</td><td>${d.d}</td><td style="font-weight:800">${wr}</td></tr>`;
      }).join('') || '<tr><td colspan="6" style="text-align:center; color:var(--text-muted)">データなし</td></tr>';
    };
    fill('stadium-tbody-central', central);
    fill('stadium-tbody-pacific', pacific);
    fill('stadium-tbody-other', [], true);
  }

  function renderBestWorst(records) {
    const sorted = [...records].sort((a,b) => b.satisfaction - a.satisfaction || b.date.localeCompare(a.date));
    const best = sorted.slice(0, 5);
    const worst = [...sorted].reverse().slice(0, 5);
    const fmt = r => `<div style="padding:0.75rem; border-bottom:1px solid var(--border); font-size:0.85rem">
      <div style="display:flex; justify-content:space-between"><b>${r.date} vs ${getOpponentDisplay(r)}</b> <span>${starsHTML(r.satisfaction)}</span></div>
      <div style="color:var(--text-muted)">${getStadiumDisplay(r)} | ${r.cancel ? '中止' : r.scoreMyTeam + '-' + r.scoreOpponent}</div>
    </div>`;
    document.getElementById('best-games-list').innerHTML = best.map(fmt).join('');
    document.getElementById('worst-games-list').innerHTML = worst.map(fmt).join('');
  }

  function renderDetailTable() {
    const records = loadRecords();
    const search = document.getElementById('detail-search').value.toLowerCase();
    const year = document.getElementById('detail-year-filter').value;
    const resF = document.getElementById('detail-result-filter').value;
    const sort = document.getElementById('detail-sort').value;

    const years = [...new Set(records.map(r => r.date.slice(0,4)))].sort();
    document.getElementById('detail-year-filter').innerHTML = '<option value="">全年度</option>' + years.map(y => `<option value="${y}">${y}年</option>`).join('');
    document.getElementById('detail-year-filter').value = year;

    let filtered = records.filter(r => {
      const res = getResult(r);
      return (!search || getOpponentDisplay(r).toLowerCase().includes(search) || (r.comment||'').toLowerCase().includes(search)) &&
             (!year || r.date.startsWith(year)) &&
             (!resF || res === resF);
    });

    filtered.sort((a,b) => sort === 'asc' ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));

    document.getElementById('detail-tbody').innerHTML = filtered.map((r, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${r.date}</td>
        <td style="font-weight:700">${getOpponentDisplay(r)}</td>
        <td>${r.stance}</td>
        <td>${getStadiumDisplay(r)}</td>
        <td style="font-weight:800">${r.cancel ? '中止' : r.scoreMyTeam + '-' + r.scoreOpponent}</td>
        <td style="color:${getResult(r)==='勝'?'var(--win)':getResult(r)==='負'?'var(--lose)':'var(--text)'}">${getResult(r)}</td>
        <td>${starsHTML(r.satisfaction)}</td>
        <td>
          <button class="btn btn-primary btn-sm" onclick="openEditModal(${records.indexOf(r)})">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="deleteRecord(${records.indexOf(r)})">🗑️</button>
        </td>
      </tr>
    `).join('');
  }

  // --- EDIT / DELETE ---
  function openEditModal(idx) {
    const r = loadRecords()[idx];
    document.getElementById('edit-idx').value = idx;
    document.getElementById('e-date').value = r.date;
    document.getElementById('e-dow').value = r.dow;
    document.getElementById('e-opponent').value = r.opponentType;
    if (r.opponentType === '__intl__' || r.opponentType === '__other__') {
      document.getElementById('e-opponent-custom-wrap').style.display = '';
      document.getElementById('e-opponent-custom').value = r.opponentCustom;
    }
    document.getElementById('e-stance').value = r.stance;
    document.getElementById('e-stadium').value = r.stadiumType;
    if (r.stadiumType === '__other__') {
      document.getElementById('e-stadium-custom-wrap').style.display = '';
      document.getElementById('e-stadium-custom').value = r.stadiumCustom;
    }
    document.getElementById('e-cancel').checked = r.cancel;
    document.getElementById('e-score-my').value = r.scoreMyTeam;
    document.getElementById('e-score-opp').value = r.scoreOpponent;
    document.getElementById('e-comment').value = r.comment;
    const sat = document.querySelector(`input[name="e-satisfaction"][value="${r.satisfaction}"]`);
    if (sat) sat.checked = true;
    document.getElementById('edit-modal').classList.add('active');
  }
  function closeEditModal() { document.getElementById('edit-modal').classList.remove('active'); }
  async function saveEdit() {
    const idx = document.getElementById('edit-idx').value;
    const records = loadRecords();
    const date = document.getElementById('e-date').value;
    const oppType = document.getElementById('e-opponent').value;
    const sat = document.querySelector('input[name="e-satisfaction"]:checked');
    
    records[idx] = {
      ...records[idx],
      date,
      dow: DAYS[new Date(date + 'T00:00:00').getDay()],
      opponent: (oppType === '__intl__' || oppType === '__other__') ? document.getElementById('e-opponent-custom').value : oppType,
      opponentType: oppType,
      opponentCustom: document.getElementById('e-opponent-custom').value,
      stance: document.getElementById('e-stance').value,
      stadium: document.getElementById('e-stadium').value === '__other__' ? document.getElementById('e-stadium-custom').value : document.getElementById('e-stadium').value,
      stadiumType: document.getElementById('e-stadium').value,
      stadiumCustom: document.getElementById('e-stadium-custom').value,
      cancel: document.getElementById('e-cancel').checked,
      scoreMyTeam: document.getElementById('e-score-my').value,
      scoreOpponent: document.getElementById('e-score-opp').value,
      comment: document.getElementById('e-comment').value,
      satisfaction: sat ? parseInt(sat.value) : 0
    };
    saveRecords(records);
    closeEditModal();
    renderDetailTable();
    showToast('更新しました', 'success');
    if (document.getElementById('gh-auto-sync').checked) await pushToGithub('試合記録の編集');
  }
  async function deleteRecord(idx) {
    if (!confirm('本当に削除しますか？')) return;
    const records = loadRecords();
    records.splice(idx, 1);
    saveRecords(records);
    renderDetailTable();
    showToast('削除しました', 'error');
    if (document.getElementById('gh-auto-sync').checked) await pushToGithub('試合記録の削除');
  }

  // --- GITHUB API ---
  function saveGithubConfig() {
    const config = {
      user: document.getElementById('gh-user').value.trim(),
      repo: document.getElementById('gh-repo').value.trim(),
      path: document.getElementById('gh-path').value.trim(),
      token: document.getElementById('gh-token').value.trim()
    };
    localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(config));
    showToast('GitHub設定を保存しました', 'success');
    fetchGithubCSV();
  }

  async function fetchGithubCSV() {
    const raw = localStorage.getItem(GH_CONFIG_KEY);
    if (!raw) return;
    const config = JSON.parse(raw);
    if (!config.user || !config.repo || !config.path) return;

    document.getElementById('gh-user').value = config.user;
    document.getElementById('gh-repo').value = config.repo;
    document.getElementById('gh-path').value = config.path;
    document.getElementById('gh-token').value = config.token;

    const status = document.getElementById('sync-status');
    status.textContent = '🔄 同期中...';
    
    try {
      const apiUrl = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${config.path}`;
      const res = await fetch(apiUrl, { headers: config.token ? { 'Authorization': `token ${config.token}` } : {} });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      const csv = decodeURIComponent(escape(atob(data.content)));
      const parsed = Papa.parse(csv, { header: true, skipEmptyLines: true, dynamicTyping: true });
      const records = parsed.data.map(r => ({
        ...r,
        cancel: String(r.cancel).toLowerCase() === 'true',
        satisfaction: parseInt(r.satisfaction) || 0
      }));
      saveRecords(records);
      status.textContent = `✅ 同期完了 (${new Date().toLocaleTimeString()})`;
      renderTop();
    } catch (e) {
      status.textContent = '❌ 同期エラー: ' + e.message;
    }
  }

  async function pushToGithub(msg) {
    const raw = localStorage.getItem(GH_CONFIG_KEY);
    if (!raw) return;
    const config = JSON.parse(raw);
    if (!config.token) return;

    try {
      const apiUrl = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${config.path}`;
      const getRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${config.token}` } });
      let sha = null;
      if (getRes.ok) { const d = await getRes.json(); sha = d.sha; }

      const records = loadRecords();
      const headers = ['id','date','dow','opponent','opponentType','opponentCustom','stance','stadium','stadiumType','stadiumCustom','cancel','scoreMyTeam','scoreOpponent','comment','satisfaction'];
      const csv = [headers.join(','), ...records.map(r => headers.map(h => {
        let v = r[h] === undefined ? '' : r[h];
        if (typeof v === 'string' && (v.includes(',') || v.includes('"'))) v = '"' + v.replace(/"/g, '""') + '"';
        return v;
      }).join(','))].join('\n');

      await fetch(apiUrl, {
        method: 'PUT',
        headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: '[Baseball App] ' + msg, content: btoa(unescape(encodeURIComponent(csv))), sha })
      });
      showToast('GitHubへ反映しました', 'success');
    } catch (e) {
      showToast('GitHub反映エラー', 'error');
    }
  }

  // --- INIT ---
  window.onload = () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('f-date').value = today;
    updateDayOfWeek();
    fetchGithubCSV();
    renderTop();
  };
</script>
